[build]
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/bin/sh -c 'mkdir -p ~/.openclaw && echo \"{\\\"gateway\\\":{\\\"controlUi\\\":{\\\"dangerouslyAllowHostHeaderOriginFallback\\\":true},\\\"http\\\":{\\\"endpoints\\\":{\\\"responses\\\":{\\\"enabled\\\":true}}}}}\" > ~/.openclaw/openclaw.json && exec node openclaw.mjs gateway --allow-unconfigured --bind lan --port ${PORT:-18789}'"
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
